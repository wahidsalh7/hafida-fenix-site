<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حفيدة فينيكس | Hafida Fénix</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181c24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #e11d48;
      --border: #262c38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .container { max-width: 1050px; margin: auto; padding: 24px 16px; }
    header {
      display: flex; flex-wrap: wrap; gap: 24px; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; margin-bottom: 32px;
    }
    header img {
      width: 160px; height: 210px; object-fit: cover;
      border-radius: 12px; border: 1px solid var(--border);
    }
    header .info { flex: 1; min-width: 240px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    h2 { font-size: 1.35rem; margin: 28px 0 14px; border-right: 4px solid var(--accent); padding-right: 10px; }
    p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px;
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 8px; color: #fff; }
    .video-box {
      position: relative; padding-bottom: 56.25%; height: 0;
      overflow: hidden; border-radius: 12px; margin-bottom: 10px; background: #000;
    }
    .video-box iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
    .socials { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .btn {
      display: inline-block; padding: 9px 16px; border-radius: 10px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    }
    .btn.secondary { background: #232936; color: var(--text); border: 1px solid var(--border); }
    footer { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 40px; padding: 20px 0; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img id="site-cover" src="book.jpg" alt="غلاف حفيدة فينيكس" />
      <div class="info">
        <h1 id="site-title">حفيدة فينيكس — Hafida Fénix</h1>
        <p id="site-bio">منصة للتدوين، مشاركة الكتب والمقالات، الفيديوهات والروابط الشخصية باحترافية.</p>
        <div class="socials" id="social-links"></div>
      </div>
    </header>

    <section>
      <h2>المقالات</h2>
      <div class="grid" id="articles-list"></div>
    </section>

    <section>
      <h2>الفيديوهات (YouTube)</h2>
      <div class="grid" id="videos-list"></div>
    </section>

    <section>
      <h2>معرض الصور</h2>
      <div class="grid" id="gallery-list"></div>
    </section>

    <footer>
      <span id="footer-text">جميع الحقوق محفوظة © حفيدة فينيكس</span>
    </footer>
  </div>

  <script>
    // عدّل البيانات هنا بسهولة أو اربطها بمصدر خارجي
    const SITE_DATA = {
      title: "حفيدة فينيكس — Hafida Fénix",
      bio: "مساحة إبداعية للمقالات، الإصدارات، الفيديوهات، وحساباتي الرسمية.",
      coverImage: "book.jpg",
      socials: [
        { name: "YouTube", url: "https://youtube.com" },
        { name: "Instagram", url: "https://instagram.com" },
        { name: "Facebook", url: "https://facebook.com" },
        { name: "TikTok", url: "https://tiktok.com" }
      ],
      articles: [
        {
          title: "مرحباً بكم في منصة حفيدة فينيكس",
          date: "2026",
          summary: "مقال افتتاحي يستعرض أهداف المنصة والمحتوى القادم من مقالات وكتب وفيديوهات."
        }
      ],
      youtubeUrls: [
        "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      ],
      gallery: [
        { src: "book.jpg", caption: "غلاف العمل الرئيسي" }
      ]
    };

    function getYouTubeId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
      return match ? match[1] : null;
    }

    document.getElementById("site-title").textContent = SITE_DATA.title;
    document.getElementById("site-bio").textContent = SITE_DATA.bio;
    document.getElementById("site-cover").src = SITE_DATA.coverImage;

    const socialsEl = document.getElementById("social-links");
    SITE_DATA.socials.forEach(s => {
      const a = document.createElement("a");
      a.className = "btn secondary";
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = s.name;
      socialsEl.appendChild(a);
    });

    const articlesEl = document.getElementById("articles-list");
    SITE_DATA.articles.forEach(art => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<h3>${art.title}</h3><small style="color:#9ca3af">${art.date}</small><p style="margin-top:8px">${art.summary}</p>`;
      articlesEl.appendChild(div);
    });

    const videosEl = document.getElementById("videos-list");
    SITE_DATA.youtubeUrls.forEach(url => {
      const id = getYouTubeId(url);
      if (!id) return;
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<div class="video-box"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe></div><a class="btn secondary" href="${url}" target="_blank" rel="noopener noreferrer">مشاهدة على يوتيوب</a>`;
      videosEl.appendChild(div);
    });

    const galleryEl = document.getElementById("gallery-list");
    SITE_DATA.gallery.forEach(item => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<img src="${item.src}" alt="${item.caption}" style="width:100%;height:220px;object-fit:cover;border-radius:10px;margin-bottom:8px" /><p>${item.caption}</p>`;
      galleryEl.appendChild(div);
    });
  </script>
</body>
</html>
