<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hafida Fenix | حفيدة فينيكس</title>
  <style>
    :root { --bg: #0f1115; --card: #181b22; --text: #f3f4f6; --muted: #9ca3af; --accent: #d4af37; --border: #2a2f3a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .btn { background: var(--accent); color: #111; border: none; padding: 9px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 13px; border-radius: 8px; cursor: pointer; }
    section { margin-top: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    h2 { margin-bottom: 14px; color: var(--accent); font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .item { background: #12151b; border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .item h3 { font-size: 1rem; margin-bottom: 6px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .admin-panel { display: none; margin-top: 24px; border-color: var(--accent); }
    .admin-panel.active { display: block; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; font-size: 0.9rem; color: var(--muted); }
    input, textarea { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: #0f1115; color: var(--text); }
    textarea { min-height: 85px; resize: vertical; }
    .row-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">Hafida Fenix</div>
    <div>
      <button class="btn-ghost" onclick="toggleAdmin()">لوحة الإدارة</button>
    </div>
  </header>

  <section id="contacts-section">
    <h2>التواصل والدفع والاستشارات</h2>
    <div class="grid" id="settings-view"></div>
  </section>

  <section id="books-section">
    <h2>الكتب</h2>
    <div class="grid" id="books-view"></div>
  </section>

  <section id="articles-section">
    <h2>المقالات اليومية</h2>
    <div class="grid" id="articles-view"></div>
  </section>

  <section id="admin-panel" class="admin-panel">
    <h2>إدارة الموقع (تحديث مباشر وإضافة محتوى)</h2>
    <h3>1. تحديث الاتصال والدفع والاستشارات</h3>
    <label>البريد الإلكتروني / رقم التواصل</label>
    <input id="inp-contact" type="text" />
    <label>معلومات الدفع</label>
    <input id="inp-payment" type="text" />
    <label>تفاصيل الاستشارات القانونية</label>
    <textarea id="inp-consultation"></textarea>
    <div class="row-actions">
      <button class="btn" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>

    <hr style="margin: 22px 0; border-color: var(--border);" />
    <h3>2. إضافة كتاب جديد</h3>
    <label>عنوان الكتاب</label>
    <input id="inp-book-title" type="text" />
    <label>وصف مختصر</label>
    <textarea id="inp-book-desc"></textarea>
    <div class="row-actions">
      <button class="btn" onclick="addBook()">إضافة الكتاب</button>
    </div>

    <hr style="margin: 22px 0; border-color: var(--border);" />
    <h3>3. إضافة مقال جديد</h3>
    <label>عنوان المقال</label>
    <input id="inp-article-title" type="text" />
    <label>محتوى المقال</label>
    <textarea id="inp-article-body"></textarea>
    <div class="row-actions">
      <button class="btn" onclick="addArticle()">إضافة المقال</button>
      <button class="btn-ghost" onclick="resetSiteData()">استعادة الافتراضي</button>
    </div>
  </section>
</div>
<script>
const STORAGE_KEY = "hafida_fenix_site_v1";
const defaultData = {
  settings: {
    contact: "contact@hafidafenix.com",
    payment: "تحويل بنكي مباشر / بطاقات الدفع المعتمدة",
    consultation: "جلسات استشارية متخصصة تُرتّب مسبقاً بعد تأكيد الطلب."
  },
  books: [
    { title: "إصدارات حفيدة فينيكس", desc: "مؤلفات وأبحاث مختارة ضمن مكتبة الموقع." }
  ],
  articles: [
    { title: "مقال افتتاحي", desc: "مساحة للنشر اليومي وتحديث المحتوى مباشرة." }
  ]
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(defaultData);
    const parsed = JSON.parse(raw);
    return {
      settings: { ...defaultData.settings, ...(parsed.settings || {}) },
      books: Array.isArray(parsed.books) ? parsed.books : [...defaultData.books],
      articles: Array.isArray(parsed.articles) ? parsed.articles : [...defaultData.articles]
    };
  } catch (_) {
    return structuredClone(defaultData);
  }
}

let state = loadData();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderAll();
}

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function renderAll() {
  document.getElementById("settings-view").innerHTML = `
    <div class="item"><h3>التواصل</h3><p class="muted">${escapeHtml(state.settings.contact)}</p></div>
    <div class="item"><h3>الدفع</h3><p class="muted">${escapeHtml(state.settings.payment)}</p></div>
    <div class="item"><h3>الاستشارات</h3><p class="muted">${escapeHtml(state.settings.consultation)}</p></div>
  `;

  document.getElementById("books-view").innerHTML = state.books.map(b => `
    <div class="item"><h3>${escapeHtml(b.title)}</h3><p class="muted">${escapeHtml(b.desc)}</p></div>
  `).join("");

  document.getElementById("articles-view").innerHTML = state.articles.map(a => `
    <div class="item"><h3>${escapeHtml(a.title)}</h3><p class="muted">${escapeHtml(a.desc)}</p></div>
  `).join("");

  document.getElementById("inp-contact").value = state.settings.contact;
  document.getElementById("inp-payment").value = state.settings.payment;
  document.getElementById("inp-consultation").value = state.settings.consultation;
}

function toggleAdmin() {
  document.getElementById("admin-panel").classList.toggle("active");
}

function saveSettings() {
  state.settings = {
    contact: document.getElementById("inp-contact").value.trim(),
    payment: document.getElementById("inp-payment").value.trim(),
    consultation: document.getElementById("inp-consultation").value.trim()
  };
  saveState();
}

function addBook() {
  const title = document.getElementById("inp-book-title").value.trim();
  const desc = document.getElementById("inp-book-desc").value.trim();
  if (!title) return;
  state.books.unshift({ title, desc });
  document.getElementById("inp-book-title").value = "";
  document.getElementById("inp-book-desc").value = "";
  saveState();
}

function addArticle() {
  const title = document.getElementById("inp-article-title").value.trim();
  const desc = document.getElementById("inp-article-body").value.trim();
  if (!title) return;
  state.articles.unshift({ title, desc });
  document.getElementById("inp-article-title").value = "";
  document.getElementById("inp-article-body").value = "";
  saveState();
}

function resetSiteData() {
  state = structuredClone(defaultData);
  saveState();
}

renderAll();
</script>
</body>
</html>
