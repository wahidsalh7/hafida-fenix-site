<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>تسجيل دخول الأدمن</title>
<style>
body { background: #0f172a; color: #fff; font-family: Tahoma; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
.box { background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; width: 300px; text-align: center; }
input { width: 100%; padding: 12px; margin: 15px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; box-sizing: border-box; }
button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
    <h2>🔐 دخول الأدمن</h2>
    {% if error %}<p style="color:red; font-size:0.9rem;">كلمة المرور غير صحيحة</p>{% endif %}
    <form method="POST">
        <input type="password" name="password" placeholder="أدخل الرمز السري" required>
        <button type="submit">دخول</button>
    </form>
    <a href="/" style="color:#94a3b8; display:block; margin-top:15px; text-decoration:none; font-size:0.9rem;">العودة للموقع</a>
</div>
</body></html>
